<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechHub Push Admin</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>TechHub Push Admin</h1>
        <span id="adminUserLabel" class="user-label">-</span>
      </header>

      <div id="errorSection" class="error-section hidden">
        <p id="errorMessage" class="error-text">-</p>
        <button id="retryBtn" class="btn btn-secondary" type="button">Thử lại</button>
      </div>

      <div id="deniedSection" class="denied-section hidden">
        <p>Tài khoản hiện tại không có quyền admin.</p>
      </div>

      <div id="adminSection" class="admin-section hidden">
        <div class="admin-panel-box">
          <div class="admin-panel-title">Ngưỡng / Push global</div>
          <div class="admin-form-row">
            <label for="settingMaxComments">max_comments</label>
            <input id="settingMaxComments" type="number" min="1" max="200" />
          </div>
          <div class="admin-form-row">
            <label for="settingPushUltra">push_ultra</label>
            <input id="settingPushUltra" type="checkbox" />
          </div>
          <div class="admin-form-row">
            <label for="settingExceed1">exceed_max_1_users</label>
            <input id="settingExceed1" type="text" placeholder="user1,user2" />
          </div>
          <div class="admin-form-row">
            <label for="settingExceed3">exceed_max_3_users</label>
            <input id="settingExceed3" type="text" placeholder="user1,user2" />
          </div>
          <div class="admin-form-actions">
            <button id="saveSettingsBtn" class="btn btn-primary" type="button">Lưu settings</button>
            <button id="reloadSettingsBtn" class="btn btn-secondary" type="button">Tải lại</button>
          </div>
          <div id="settingsMessage" class="admin-msg hidden"></div>

          <div class="admin-panel-divider"></div>

          <div class="admin-panel-title">Push 1 bài (is_ultra)</div>
          <div class="admin-form-row">
            <label for="pushTechhubId">techhub_id</label>
            <input id="pushTechhubId" type="number" min="1" placeholder="vd: 4081" />
          </div>
          <div id="pushPostPreview" class="admin-msg muted hidden"></div>
          <div class="admin-form-actions">
            <button id="lookupPostBtn" class="btn btn-secondary" type="button">Xem bài</button>
            <button id="enableUltraBtn" class="btn btn-primary" type="button">Bật Ultra</button>
            <button id="disableUltraBtn" class="btn btn-secondary" type="button">Tắt Ultra</button>
            <button id="deleteInteractionsBtn" class="btn btn-danger" type="button">
              Xóa interactions
            </button>
          </div>
          <div id="pushPostMessage" class="admin-msg hidden"></div>
          <p class="admin-hint">
            Xóa interactions sẽ mở lại lượt tương tác cho các user cũ; không xóa
            comment/like đã có trên TechHub.
          </p>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechHub Profile Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      
      <!-- Require Login Alert -->
      <div id="requireLoginAlert" class="require-login-alert hidden">
        <span style="font-size: 16px;">⚠️</span> 
        <span>Vui lòng <a href="https://techhub.fpt.net" target="_blank" style="color: #667eea; font-weight: bold; text-decoration: underline;">mở TechHub</a> và đăng nhập trước khi sử dụng!</span>
      </div>

      <!-- Error Section -->
      <div id="errorSection" class="error-section hidden">
        <div class="error-icon">⚠️</div>
        <p id="errorMessage" class="error-text">-</p>
        <button id="retryBtn" class="btn btn-secondary error-retry-btn" title="Thử tải lại cấu hình và kết nối">Thử lại</button>
      </div>

      <!-- User Profile Section -->
      <div id="profileSection" class="profile-section hidden">
        <div class="profile-main">
          <div class="profile-header">
            <img id="userAvatar" src="" alt="Avatar" class="avatar" />
            <div class="profile-info">
              <h2 id="displayName">-</h2>
              <p id="userEmail" class="email">-</p>
              <div class="badges-row" style="display: flex; gap: 8px; margin-top: 5px;">
                <span id="userDepartment" class="department-badge" style="cursor: pointer;" title="Chạy tương tác ngầm">-</span>
                <span class="oxygen-badge" style="background: rgba(255, 255, 255, 0.1); padding: 2px 8px; border-radius: 12px; font-size: 12px; color: #a0aec0; display: flex; align-items: center; gap: 4px;">
                  <img src="icons/coin.png" alt="Coin" style="width: 14px; height: 14px; display: block;" />
                  <span id="oxygenCount">0</span>
                </span>
              </div>
            </div>

            <div class="header-actions">
              <button id="adminBtn" class="icon-btn hidden" title="Quản trị người dùng" style="background: rgba(255, 255, 255, 0.1); margin-right: 8px;">
                <span class="btn-icon">⚙️</span>
              </button>
              <button id="syncPostsBtn" class="btn btn-sync-posts" title="Đồng bộ 10 bài viết mới nhất của bạn từ TechHub về cơ sở dữ liệu">
                <span class="btn-icon">📝</span>
                <span class="btn-text">Đồng bộ</span>
              </button>
            </div>
          </div>

          <div id="syncPostsMessage" class="sync-message hidden"></div>

          <!-- Interactive Section -->
          <div class="interact-section">
            <div id="interactLog" class="interact-log hidden">
              <!-- Logs will be inserted here -->
            </div>
          </div>

          <!-- Posts Grid Section -->
          <div class="posts-grid-section">
            <div class="posts-grid-header">
              <h3>Bài viết của bạn</h3>
              <div class="posts-header-right">
                <span id="postsTotal" class="posts-total">0 bài</span>
                <button id="reloadPostsBtn" class="icon-btn" title="Tải lại danh sách bài viết từ cơ sở dữ liệu">
                  <span class="reload-icon">🔄</span>
                </button>
              </div>
            </div>

            <div id="postsGrid" class="posts-grid">
              <!-- Posts will be loaded here -->
            </div>

            <div id="postsLoading" class="posts-loading hidden">
              <div class="loading-spinner"></div>
              <span>Đang tải...</span>
            </div>

            <div id="postsError" class="posts-error hidden">
              <span>⚠️ Chưa có bài viết nào</span>
            </div>
          </div>
          
          <!-- Admin Section -->
          <div id="adminSection" class="admin-section hidden">
            <div class="posts-grid-header">
              <h3>Quản trị người dùng</h3>
              <div class="posts-header-right">
                <button id="closeAdminBtn" class="icon-btn" title="Đóng trang quản trị">
                  <span class="reload-icon">❌</span>
                </button>
              </div>
            </div>
            
            <div class="admin-grid-container">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Người dùng</th>
                    <th style="width: 45px; text-align: center;" title="Tổng số bài viết">Bài viết</th>
                    <th style="width: 45px; text-align: center;" title="Số bài đang chờ publish">⭐</th>
                    <th style="width: 45px; text-align: center;" title="Lượt tương tác trong ngày hôm nay">T.Tác</th>
                    <th style="width: 50px; text-align: center;">Admin</th>
                    <th style="width: 50px; text-align: center;">Khóa</th>
                  </tr>
                </thead>
                <tbody id="adminUsersList">
                  <!-- Users will be loaded here -->
                </tbody>
              </table>
              <div id="adminLoading" class="posts-loading hidden">
                <div class="loading-spinner"></div>
                <span>Đang tải...</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
